<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#050811" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8" />

  <!-- Subtle Radial Glow Behind Building -->
  <circle cx="256" cy="240" r="150" fill="#f59e0b" opacity="0.12" filter="url(#glow)" />

  <!-- Classical Architecture Pediment (Roof) -->
  <path d="M 120 180 L 256 100 L 392 180 Z" fill="url(#goldGrad)" />
  <rect x="130" y="180" width="252" height="18" rx="4" fill="#fde68a" />

  <!-- Pillars (4 Stately Columns) -->
  <!-- Pillar 1 -->
  <rect x="150" y="208" width="28" height="150" rx="6" fill="url(#goldGrad)" />
  <rect x="144" y="198" width="40" height="10" rx="2" fill="#fde68a" />
  <rect x="144" y="358" width="40" height="12" rx="2" fill="#fde68a" />

  <!-- Pillar 2 (with Cyan energy accent) -->
  <rect x="214" y="208" width="28" height="150" rx="6" fill="url(#skyGrad)" />
  <rect x="208" y="198" width="40" height="10" rx="2" fill="#bae6fd" />
  <rect x="208" y="358" width="40" height="12" rx="2" fill="#bae6fd" />

  <!-- Pillar 3 (with Cyan energy accent) -->
  <rect x="270" y="208" width="28" height="150" rx="6" fill="url(#skyGrad)" />
  <rect x="264" y="198" width="40" height="10" rx="2" fill="#bae6fd" />
  <rect x="264" y="358" width="40" height="12" rx="2" fill="#bae6fd" />

  <!-- Pillar 4 -->
  <rect x="334" y="208" width="28" height="150" rx="6" fill="url(#goldGrad)" />
  <rect x="328" y="198" width="40" height="10" rx="2" fill="#fde68a" />
  <rect x="328" y="358" width="40" height="12" rx="2" fill="#fde68a" />

  <!-- Base Podium -->
  <rect x="110" y="370" width="292" height="20" rx="4" fill="url(#goldGrad)" />
  <rect x="90" y="390" width="332" height="24" rx="6" fill="#b45309" />

  <!-- Center Shield / Strategy Insignia -->
  <circle cx="256" cy="280" r="38" fill="#050811" stroke="url(#goldGrad)" stroke-width="4" />
  <path d="M 256 256 L 278 274 L 270 304 L 242 304 L 234 274 Z" fill="url(#emeraldGrad)" />
  <text x="256" y="286" font-family="'Inter', 'Noto Sans TC', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">HTS</text>

  <!-- Dual Mentor Stars -->
  <polygon points="256,128 261,142 276,142 264,152 268,166 256,156 244,166 248,152 236,142 251,142" fill="#fde68a" />

  <!-- Bottom Brand Ribbon Badge -->
  <rect x="146" y="428" width="220" height="42" rx="21" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2.5" />
  <text x="256" y="455" font-family="'Noto Sans TC', sans-serif" font-size="19" font-weight="900" fill="#fde68a" text-anchor="middle" letter-spacing="1">房商策略智庫</text>
</svg>
